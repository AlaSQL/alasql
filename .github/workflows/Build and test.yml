name: 'CI build & test'

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

permissions: read-all

jobs:
  'Verify Formatting':
    permissions:
      contents: read
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: '24.x'

      - name: Cache Yarn dependencies
        uses: actions/cache@13aacd865c20de90e7f32385cc9f60de075b8dc3 # v4.0.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify formatting
        run: yarn test-format-all

  'Build':
    needs: ['Verify Formatting']
    permissions:
      contents: write
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: '24.x'

      - name: Cache Yarn dependencies
        uses: actions/cache@13aacd865c20de90e7f32385cc9f60de075b8dc3 # v4.0.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build-only

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

      - name: Package node_modules
        run: tar --exclude='.cache' -cvf node_modules.tar node_modules

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node_modules
          path: node_modules.tar

  'Test Node':
    permissions:
      contents: read
    needs: ['Verify Formatting', 'Build']
    runs-on: blacksmith-4vcpu-ubuntu-2204
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x] # Dropped '23.x' (EOL) and 'latest' for stability
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # master
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # master
        with:
          name: node_modules
          path: ./

      - name: Unpack node_modules
        run: tar -xvf node_modules.tar

      - name: Run Node tests
        run: yarn test-ci

  'Test Browser':
    permissions:
      contents: read
    needs: ['Verify Formatting', 'Build']
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # master
        with:
          name: dist
          path: dist/

      - name: Placeholder for browser tests
        run: echo '::warning ::Not able to automate browser tests yet'

      - name: Run browser tests (disabled)
        run: '# yarn test-browser-ci'

name: 'CI build & test'

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

permissions:
  contents: read

jobs:
  verify-formatting:
    name: Verify code formatting
    permissions:
      contents: read
    # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
    # runs-on: blacksmith-4vcpu-ubuntu-2204
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
        # uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify formatting
        run: yarn test-format-all

  build:
    name: Build from source files
    needs: []
    permissions:
      contents: read
    # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
    # runs-on: blacksmith-4vcpu-ubuntu-2204
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
        # uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build project
        run: yarn build-only

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Package node_modules
        run: tar --exclude='.cache' -cvf node_modules.tar node_modules

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node_modules
          path: node_modules.tar

  test-suite-node:
    name: Test suite for Node
    permissions:
      contents: read
    needs: [build, verify-formatting]
    # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
    # runs-on: blacksmith-4vcpu-ubuntu-2204
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x] # Dropped '23.x' (EOL) and 'latest' for stability
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
        # uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node_modules
          path: ./

      - name: Unpack node_modules
        run: tar -xvf node_modules.tar

      - name: Run test suite
        run: yarn test-only

  test-suite-browser:
    name: Test suite for Browser
    permissions:
      contents: read
    needs: [build, verify-formatting]
    # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
    # runs-on: blacksmith-4vcpu-ubuntu-2204
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Placeholder for browser tests
        run: echo '::warning ::Not able to automate browser tests yet'

      - name: Run browser tests (disabled)
        run: '# yarn test-browser-ci'

  verify-parser:
    name: Verify grammar vs generated parser
    needs: []
    permissions:
      contents: read
    # Blacksmith sponsors AlaSQL and is faster with better dashboards, but our usage often peaks beyond the sponsored minutes with no auto fallback, so CI runs on GitHub's runners. We still love them and you should really convince your company to make its builds so much faster with a one-line change.
    # runs-on: blacksmith-4vcpu-ubuntu-2204
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs on every change, so the committed parser always matches its grammar
      - name: Check that the parser matches the grammar
        run: yarn test-parser || (echo "Please run 'yarn jison && yarn test' and commit again." && exit 1)

  dialect-test:
    name: Dialect test against SQLite
    permissions:
      contents: read
    needs: [build, verify-formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Fails on a difference from SQLite that is not listed in test/dialect/expected-differences,
      # and on a listed one that changed. SQLite is the one inside Bun, so there is nothing to install.
      - name: Run the dialect test
        run: bun test/dialect/run.js

  run-state-check:
    name: Run-state check of compiled queries
    permissions:
      contents: read
    needs: [build, verify-formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node_modules
          path: ./

      - name: Unpack node_modules
        run: tar -xf node_modules.tar

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Runs the suite and fails when a run writes to a compiled query or to one of its sources,
      # which every run of the cached statement shares (#2596). See test/runstate/README.md.
      - name: Run the run-state check
        run: bun test/runstate/run.js

  binding-check:
    name: Binding check of column references
    permissions:
      contents: read
    needs: [build, verify-formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node_modules
          path: ./

      - name: Unpack node_modules
        run: tar -xf node_modules.tar

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Runs the suite and fails when bind.column throws, or when it and today's column lookup
      # differ in a case that is not one of the known ones (#2723). See test/bind/README.md.
      - name: Run the binding check
        run: bun test/bind/run.js

  parity-check:
    name: Parity check against the base of the pull request
    # The reference is the commit the pull request starts from, so there is nothing to compare on a push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
    needs: [build, verify-formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # The whole history: the reference is the merge base with main, built from its own commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node_modules
          path: ./

      - name: Unpack node_modules
        run: tar -xf node_modules.tar

      # Builds the base with its own build and runs the suite of the pull request on it, twice,
      # to find the statements the base itself answers differently run by run.
      # Then dist/ is rebuilt from the pull request.
      - name: Record the base
        run: |
          base=$(git merge-base origin/main HEAD)
          echo "PARITY_BASE=$base" >> "$GITHUB_ENV"
          bun test/parity/run.js record base --ref "$base"

      - name: Record the pull request
        run: bun test/parity/run.js record pr --once

      # A pull request that fixes something differs from its base on purpose, so a difference in
      # a result, an error or generated code is reported and does not fail. The job fails on a
      # crash of a recording (the two steps above), on a file that diverged, on a file that ran
      # tests and recorded no statement, and on an API difference not in test/parity/api-allowed.txt.
      - name: Compare and write the report to the job summary
        run: |
          status=0
          bun test/parity/run.js compare base pr --allow-differences --limit 50 > parity-report.txt 2>&1 || status=$?
          cat parity-report.txt
          {
            echo "### Parity check: base ${PARITY_BASE} (a) against this pull request (b)"
            echo
            echo 'Differences in results, errors and generated code are listed for the reviewer and do not fail the job. See `test/parity/README.md`.'
            echo
            echo '````text'
            head -c 900000 parity-report.txt
            echo
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
